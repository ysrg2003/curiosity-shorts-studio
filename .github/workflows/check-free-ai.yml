name: Check free model connection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned owner adapter, no key available
        run: python -m pip install -e '.[free-ai]'
      - name: Synthetic free-only request, fixed diagnostic categories only
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python - <<'PY'
          import json
          from curiosity.remote_ai import request
          for mode in ['plaintext','strict-json']:
            schema={'type':'object','properties':{'ok':{'type':'boolean'}},'required':['ok']} if mode=='strict-json' else None
            try:
              output,stats=request('Return a single true ok value as a JSON object.' if schema else 'Reply with the word ready.', 'Synthetic connectivity test. No tools or external actions.', schema=schema)
              good=output.get('ok') is True if schema else isinstance(output,str) and bool(output.strip())
              print(json.dumps({'mode':mode,'output_shape_valid':good,'model':stats['model'],'usage':stats['usage'],'paid_fallback_allowed':False}))
              if not good:raise RuntimeError('Synthetic output did not match its expected shape')
            except RuntimeError as error:
              print(str(error))
              raise SystemExit(1)
          PY
