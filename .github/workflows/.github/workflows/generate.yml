name: Generate science videos
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Starter visual-parity pack or newly researched topic
        type: choice
        options: [starter, new-topic]
        default: starter
      video_count:
        description: Number of complete videos, check free allowance before increasing
        type: number
        default: 1
      voice:
        description: Kokoro runs locally; Edge attempts original online voices
        type: choice
        options: [kokoro, edge]
        default: kokoro
      topic:
        description: New-topic subject, one subject per line for a batch
        type: string
        default: Why do we get goosebumps?
      source_urls:
        description: Optional readable HTTPS source URLs, one per line
        type: string
        required: false
      episode:
        description: Starter pack
        type: choice
        options: [stomach-growl, brain-freeze, dizziness, onion-tears, hiccups]
        default: stomach-growl
permissions:
  contents: write
concurrency:
  group: curiosity-generate
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      VIDEO_COUNT: ${{ inputs.video_count }}
      MODE: ${{ inputs.mode }}
      VOICE: ${{ inputs.voice }}
      TOPIC: ${{ inputs.topic }}
      SOURCE_URLS: ${{ inputs.source_urls }}
      EPISODE: ${{ inputs.episode }}
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand initial source delivery, if present
        shell: bash
        run: |
          if [ -f source.b64 ]; then base64 --decode source.b64 > curiosity-source.tar.gz; fi
          bundle=$(find . -maxdepth 1 -name '*curiosity-source.tar.gz' -print -quit)
          if [ -n "$bundle" ]; then
            tar -xzf "$bundle"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src creative episodes tests docs pyproject.toml studio.json README.md .gitignore
            if [ -f source.b64 ]; then git rm source.b64; fi
            if ! git diff --cached --quiet; then
              git commit -m 'Expand standalone studio source'
              git push
            fi
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free rendering and voice dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng zstd
          python -m pip install -e '.[test,local-voice]'
      - name: Unit and safety checks
        run: python -m pytest -q
      - name: Start local drafting model, new-topic mode only
        if: inputs.mode == 'new-topic'
        shell: bash
        run: |
          curl --fail --location --retry 2 https://github.com/ollama/ollama/releases/download/v0.40.17/ollama-linux-amd64.tar.zst -o /tmp/ollama.tar.zst
          mkdir -p /tmp/ollama
          tar --zstd -xf /tmp/ollama.tar.zst -C /tmp/ollama
          /tmp/ollama/bin/ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags; then break; fi
            sleep 1
          done
          /tmp/ollama/bin/ollama pull qwen3:4b
      - name: Produce complete video count, no YouTube upload
        run: python -m curiosity.batch
      - name: Retain reviewable deliverables, not model caches or tokens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-bundles
          path: |
            output/**/final.mp4
            output/**/episode.json
            output/**/manifest.json
            output/**/qa.json
            output/**/review.jpg
            output/**/captions.srt
            output/**/timeline.json
            output/batch.json
            output/generation.json
            drafts/*.json
          retention-days: 1
          if-no-files-found: warn
