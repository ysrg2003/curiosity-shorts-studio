name: Publish one reviewed video
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Generate science videos run ID
        required: true
      episode_id:
        description: Episode ID from manifest, not video title
        required: true
      sha256:
        description: Exact SHA256 of the complete video you reviewed
        required: true
      privacy:
        type: choice
        options: [private, unlisted, public]
        default: private
        description: Explicit YouTube audience
      science_checked:
        type: boolean
        default: false
        description: I checked the source claims in a newly generated draft
      approval:
        description: Type I reviewed this exact video
        required: true
permissions:
  contents: write
  actions: read
concurrency:
  group: youtube-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: youtube-publish
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Owner-authorized, channel-locked upload
        env:
          GH_TOKEN: ${{ github.token }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          EPISODE_ID: ${{ inputs.episode_id }}
          VIDEO_SHA256: ${{ inputs.sha256 }}
          PRIVACY: ${{ inputs.privacy }}
          SCIENCE_CHECKED: ${{ inputs.science_checked }}
          APPROVAL: ${{ inputs.approval }}
        run: python -m curiosity.publish
