name: Check generated-render sandbox
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install open-source component test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -e '.[test,generated-motion]'
      - name: Build fixed read-only render image
        run: docker build -t curiosity-upstream-manim:0.20.1 -f experiments/Dockerfile.manim .
      - name: Test actual Docker isolation, portrait geometry and frame decoding
        env:
          CURIOSITY_RUN_RENDER_TEST: '1'
          CURIOSITY_SMOKE_OUT: output/sandbox-smoke
        run: python -m pytest -q tests/test_render_integration.py
      - name: Keep synthetic proof only, never a provider key
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-sandbox-check
          path: output/sandbox-smoke
          retention-days: 1
          if-no-files-found: warn
