name: Check free daily counter without inference
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install owner adapter and test dependencies without secrets
        run: python -m pip install -e '.[free-ai,test]'
      - name: Unit and safety checks without secrets
        run: python -m pytest -q
      - name: Read-only quota classification, no inference or private account fields
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python - <<'PY'
          import json
          from curiosity.remote_ai import free_quota_status
          result=free_quota_status()
          print(json.dumps(result,sort_keys=True))
          if result['http_status']!=200:raise SystemExit(1)
          PY
