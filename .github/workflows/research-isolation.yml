name: Verify research isolation without inference
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4dcf344783ee9910f4e41ec801e1adbf092dbe4b
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test,research]'
      - name: Full offline synthetic suite
        run: python -m pytest -q
      - name: Verify tests did not create runtime evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from curiosity.provenance import INVALID_RUNS,validate
          assert '45111351142' in INVALID_RUNS
          assert not list(Path('drafts').glob('research-*.json'))
          assert not Path('drafts/runtime.json').exists()
          try:validate({'operator_topic_or_source_input':False},{})
          except ValueError:pass
          else:raise AssertionError('Generic flag accepted as runtime provenance')
          Path('isolation-result.json').write_text(json.dumps({'suite_completed':True,'production_drafts_clean':True,'invalid_original_run':45111351142,'inference_invoked':False,'secrets_supplied':False,'video_created':False}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: research-isolation-result
          path: isolation-result.json
          retention-days: 1
